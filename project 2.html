<html>

<head>
    <style>
        div. {
            right: 100px;
            border: 5px solid red;
        }

        div.absolute {
            position: absolute;
            left: 50px;
            border: 3px solid blue;
        }

        div.relative {
            position: relative;
            left: 100px;
            border: 3px solid pink;
        }

        div.fixed {
            position: fixed;
            width: 300px;
            right: 20px;
            border: 3px solid purple;
        }

        div.sticky {
            position: sticky;
            top: 1px;
            left: 20px;
            width: 100px;
            border: 3px solid green;
        }
    </style>
</head>

<body>
    <h2> POSITIONING </h2>
    <div>
        Div with no postion property
    </div>
    <div class="sticky">
        Div with sticky postion property
    </div>
    <div class="relative">
        Div with relative postion property
    </div>
    <div class="fixed">
        Div with fixed postion property
    </div>
